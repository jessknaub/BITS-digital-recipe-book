<!DOCTYPE html>
<html>
<head>
    <title>My Recipe Collection</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Digital Recipe Book</h1>

    <div class=""form-container"></div>
    
    <select id="recipeCategory">
    <option>Breakfast</option>
    <option>Lunch</option>
    <option>Dinner</option>
    <option>Dessert</option>
    <option>Snack</option>
    <option>Appetizer</option>
</select>

<input type="text" id = "recipeName" placeholder = "Enter receipe name">

<textarea id="recipeIngredients" 
    placeholder="Enter ingredients"></textarea>
<textarea id="recipeInstructions" 
    placeholder="Enter instructions"></textarea>
   
<button onclick="addRecipe()">Add Recipe</button>

<input id="searchBox" 
        placeholder="Search recipes..." 
        onkeyup="searchRecipes()">

<h2>Recipes:</h2>

<ul id="recipeList"></ul>

<script src="script.js"></script>

</body>
</html>
